[package]
name = "aegis"
version = "0.9.20"
edition = "2018"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "AEGIS authenticated encryption (AEAD) and MACs with AES acceleration, streaming APIs, and no_std support"
keywords = ["aead", "encryption", "aegis", "aes", "no-std"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-aegis"
repository = "https://github.com/jedisct1/rust-aegis"
categories = ["no-std", "cryptography"]
readme = "README.md"
include = [
    "/build.rs",
    "/Makefile",
    "/README.md",
    "/LICENSE",
    "/benches/**/*.rs",
    "/src/**/*.rs",
    "/src/test-vectors/*.json",
    "/src/c/libaegis/src/**/*.c",
    "/src/c/libaegis/src/**/*.h",
    "/tests/**/*.rs",
    "/wasm-libs/libaegis.a",
    "/wasm-libs/libaegis_relaxed_simd.a",
]

[target."cfg(not(any(all(target_arch = \"aarch64\", target_feature = \"aes\"),all(target_arch = \"x86_64\", target_feature = \"aes\"),all(target_arch = \"x86\", target_feature = \"aes\"))))".dependencies.softaes]
version = "0.1"

[build-dependencies]
cc = "1.4.7"

[dev-dependencies]
benchmark-simple = "0.1.11"
ascon-aead = "0.6.0"
aes-gcm = "0.11.1"
aes = "0.9.3"
ctr = "0.10.1"
chacha20poly1305 = "0.11.0"
sthash = "0.2.16"
blake3 = "1.8.7"
ct-codecs = "1.1"
serde_json = "1.0"

[dependencies]
aead = { optional = true, version = "0.6.1", features = ["rand_core"] }
getrandom = { version = "0.4", optional = true }
pastey = { version = "0.2", optional = true }
softaes = { version = "0.1", optional = true }

[target."cfg(not(any(target_arch = \"wasm32\", target_arch = \"wasm64\")))".dependencies.boring]
version = "5.2.0"
optional = true

[lib]
bench = false

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "throughput"
harness = false

[features]
default = ["std", "aegis128", "avx512"]
force-wasm-relaxed-simd = []
force-wasm-strict-simd = []
pure-rust = ["softaes"]
rustcrypto-traits-06 = ["aead", "aegis128"]
std = []
raf = ["raf-core", "getrandom"]
raf-core = ["std", "pastey", "aegis128"]
js = ["getrandom", "getrandom/wasm_js"]
# The AEGIS-128L family (AEGIS-128L, -128X2, -128X4) of the C backend. Without it, only the
# AEGIS-256 family is compiled (libaegis' DISABLE_AEGIS128).
aegis128 = []
# The AVX-512 backends of the X4 ciphers in the C backend. Without them, X4 runs on AVX2 at
# most (libaegis' DISABLE_AVX512): for code that must save the vector state it uses, such as
# kernel drivers that save only the AVX state.
avx512 = []
# Builds the C backend for code without a C runtime, such as Windows kernel drivers: no load-time
# initializer (AEGIS_NO_CONSTRUCTOR; the crate runs aegis_init before first use), no C runtime
# errno (AEGIS_NO_ERRNO), and with MSVC-style compilers no stack cookies (/GS-) and /kernel.
# Not tuned for the build machine, and no instruction set enabled beyond the backends' own
# target attributes. Uses clang-cl on MSVC targets (PATH, %LLVM_PATH%\bin, %ProgramFiles%\LLVM\bin).
kernel = []

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"

[package.metadata.docs.rs]
features = ["raf"]
rustdoc-args = ["--cfg", "docsrs"]
